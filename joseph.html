<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Djoko Joseph — Message d'anniversaire</title>
<style>
  :root {
    --navy: #0a1f44;
    --navy-light: #14295e;
    --gold: #d4af37;
    --brick: #b5442e;
    --cream: #f5ecd7;
    --text: var(--cream);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at 50% 20%, var(--navy-light), var(--navy) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212,175,55,0.35);
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .icon {
    font-size: 44px;
    margin-bottom: 8px;
  }
  .eyebrow {
    color: var(--gold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 6px;
    color: var(--cream);
  }
  .sub {
    color: rgba(245,236,215,0.75);
    font-size: 14px;
    margin-bottom: 28px;
  }
  .brick-rule {
    width: 48px;
    height: 3px;
    background: var(--brick);
    margin: 0 auto 28px;
    border-radius: 2px;
  }
  audio {
    width: 100%;
    height: 48px;
    border-radius: 12px;
    outline: none;
  }
  audio::-webkit-media-controls-panel {
    background-color: var(--navy-light);
  }
  .footer {
    margin-top: 22px;
    font-size: 12px;
    color: rgba(245,236,215,0.5);
  }
</style>
</head>
<body>

    <div class="icon">🎧</div>
